services:
  - type: web
    name: beaconcode-assess
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    initialDeployHook: python manage.py init-admin
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beaconcode-db
          property: connectionString
      - key: CPP_COMPILER
        value: /usr/bin/g++
      - key: ALLOW_UNSAFE_LOCAL_RUNNER
        value: "1"
      - key: MAX_CODE_OUTPUT_BYTES
        value: "12000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

databases:
  - name: beaconcode-db
    plan: free
    region: virginia
    databaseName: beaconcode
    user: beaconcode
